name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# GITHUB_TOKEN permissions required to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; do not cancel an in-flight publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build site
        run: python3 build.py
        env:
          # Where Pages will serve this site: "/<repo>" for a project site,
          # "" for a <user>.github.io site. Used for dist/404.html.
          PAGES_BASE_PATH: /${{ github.event.repository.name }}

      - name: Verify build output
        run: |
          set -euo pipefail
          test -s dist/index.html
          test -s dist/IPC_610.html
          test -s dist/404.html
          if grep -q '__DATA__\|__IMAGES__' dist/index.html; then
            echo "Unreplaced placeholder in dist/index.html" >&2; exit 1
          fi
          echo "dist/index.html: $(wc -c < dist/index.html) bytes"
          ls -lh dist

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
